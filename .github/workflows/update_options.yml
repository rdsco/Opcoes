name: Atualizar Margens de Opções BTG

on:
  schedule:
    # Segunda a Sexta-feira às 12:00 UTC (09:00 Horário de Brasília)
    - cron: '0 12 * * 1-5'
  workflow_dispatch:

jobs:
  update-options:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install pdfplumber pypdf

      - name: Baixar PDF do BTG e extrair opções
        run: |
          python importador_opcoes.py --no-browser

      - name: Commitar e realizar push das alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add options_data.json public/options_data.json btg_margens.pdf
          if git diff --staged --quiet; then
            echo "Nenhuma alteração encontrada nos dados das opções."
          else
            git commit -m "chore(data): atualização automática diária das opções BTG [skip ci]"
            git push
          fi
